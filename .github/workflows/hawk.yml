name: Hawk CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hawk
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Dependencies
        run: go mod download

      - name: Build Hawk
        run: go build ./...

      - name: Run Tests
        run: go test ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Build Hawk CLI
        run: |
          mkdir -p bin
          go build -o bin/hawk ./cmd/hawk

      - name: Build Test Application
        working-directory: testdata/blog
        run: |
          go mod tidy
          go build .

      # Uncomment these when the fixture database is ready.
